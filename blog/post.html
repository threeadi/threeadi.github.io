<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, follow" />
        <title>Redirecting — Tri Adi</title>
        <script>
            const slug = new URLSearchParams(location.search).get("slug");
            location.replace(slug ? `/blog/${encodeURIComponent(slug)}/` : "/blog/");
        </script>
    </head>
    <body>
        <p>Redirecting to <a href="/blog/">Engineering notes</a>…</p>
    </body>
</html>
