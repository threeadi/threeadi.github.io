<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog — Tri Adi</title>
        <meta
            name="description"
            content="Writing on software engineering, system design, and Go/PHP/Laravel."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script type="module" src="/src/blog-index.js"></script>
    </head>
    <body>
        <!-- Navbar -->
        <nav
            id="navbar"
            class="fixed top-0 left-0 right-0 h-[68px] z-50 transition-all duration-300"
        >
            <div
                class="max-w-site mx-auto px-6 h-full flex items-center justify-between"
            >
                <a
                    href="/"
                    class="font-mono text-xl font-semibold text-accent hover:text-accent-hi"
                    >tri.</a
                >
                <div class="hidden md:flex items-center gap-4">
                    <a
                        href="/#experience"
                        class="font-mono text-[0.8rem] text-t2 hover:text-accent transition-colors"
                        >Experience</a
                    >
                    <a
                        href="/#skills"
                        class="font-mono text-[0.8rem] text-t2 hover:text-accent transition-colors"
                        >Skills</a
                    >
                    <a href="/blog/" class="font-mono text-[0.8rem] text-accent"
                        >Blog</a
                    >
                    <a
                        href="/#contact"
                        class="font-mono text-[0.8rem] text-accent border border-accent px-4 py-1.5 rounded hover:bg-accent/10 transition-all"
                        >Contact</a
                    >
                </div>
            </div>
        </nav>

        <!-- Page header -->
        <header class="pt-[68px] pb-16 bg-canvas border-b border-line">
            <div class="max-w-site mx-auto px-6 pt-16">
                <p class="font-mono text-[0.9rem] text-accent mb-3">
                    03. writing
                </p>
                <h1
                    class="text-[clamp(2rem,5vw,3rem)] font-bold tracking-tight text-t1 mb-4"
                >
                    All Posts
                </h1>
                <p class="text-t2 text-base max-w-xl leading-[1.75]">
                    Thoughts on software engineering, system design, performance,
                    and building things that scale.
                </p>
            </div>
        </header>

        <!-- Posts grid -->
        <main class="py-16 bg-canvas">
            <div class="max-w-site mx-auto px-6">
                <!-- Search / filter bar -->
                <div class="flex flex-wrap gap-3 mb-10 items-center">
                    <input
                        id="search"
                        type="search"
                        placeholder="Search posts…"
                        class="bg-surface border border-line rounded-lg px-4 py-2 font-mono text-sm text-t1 placeholder:text-t3 focus:outline-none focus:border-accent transition-colors w-64"
                    />
                    <div id="tag-filters" class="flex flex-wrap gap-2">
                        <!-- tag buttons injected by JS -->
                    </div>
                </div>

                <div
                    id="posts-grid"
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
                >
                    <div
                        class="col-span-full text-center font-mono text-sm text-t3 py-12"
                    >
                        Loading posts…
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-canvas border-t border-line py-8">
            <div class="max-w-site mx-auto px-6 text-center">
                <p class="font-mono text-[0.68rem] text-t3">© 2025 Tri Adi.</p>
            </div>
        </footer>
    </body>
</html>
